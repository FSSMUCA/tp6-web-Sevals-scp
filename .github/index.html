<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WebApp Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" 
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>


<body>
  <div class="container py-4">
    <h1>Simple WebApp Calculator</h1>

    <div class="Calculator d-flex gap-2 align-items-center mt-3">

      <input id="num1" type="number" placeholder="Put your first number here" class="form-control num1" style="width:180px;">

      <select id="operators" class="form-select operators" style="width:80px;">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">÷</option>
      </select>

      <input id="num2" type="number" placeholder="Put your second number here" class="form-control num2" style="width:180px;">

      <button id="equalsBtn" class="equalsBtn">=</button>

 
      <output id="result" class="result">Result</output>
    </div>
  </div>


</body>
</html>
